<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --border: #e4e7ec;
    --accent: #4f46e5; --accent-soft: #eef0ff; --user: #4f46e5; --user-text: #fff;
    --warn: #b45309; --warn-soft: #fff7e6; --bad: #b91c1c; --bad-soft: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9aa3b2; --border: #262b36;
      --accent: #8b87ff; --accent-soft: #23244a; --user: #5b55f0; --user-text: #fff;
      --warn: #f5b041; --warn-soft: #33270f; --bad: #f87171; --bad-soft: #3a1818;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, sans-serif; display: flex; }
  .app { display: flex; flex-direction: column; width: 100%; max-width: 860px; margin: 0 auto; height: 100%; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
           border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  .ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; font-size: 13px; }
  .ghost:hover { background: var(--panel); }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bot p { margin: 0 0 6px; } .bot p:last-child { margin: 0; }
  .bot ul { margin: 4px 0 6px; padding-left: 20px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 11.5px; color: var(--muted); align-items: center; }
  .badge { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .badge.clarification { background: var(--warn-soft); color: var(--warn); }
  .badge.blocked, .badge.rejected, .badge.error { background: var(--bad-soft); color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 520px; }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .suggestions button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-size: 13.5px; }
  .suggestions button:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
             border-radius: 10px; padding: 10px 12px; min-height: 44px; max-height: 140px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { background: var(--accent); color: #fff; border: 0; padding: 0 18px; font-weight: 500; }
  .send:disabled { opacity: .5; cursor: default; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: b 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); width: min(520px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; } .stat small { color: var(--muted); }
  @media (max-width: 600px) { .msg { max-width: 95%; } header p { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Unicorn Scout</h1>
      <p>Ask about 118 Indian unicorn startups · Tracxn data, May 2025</p>
    </div>
    <div class="actions">
      <button class="ghost" id="metricsBtn" type="button">Metrics</button>
      <button class="ghost" id="newBtn" type="button">New chat</button>
    </div>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="input" rows="1" maxlength="500" placeholder="Ask about a company, sector or city…" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<dialog id="metrics">
  <h3 style="margin:0">Usage metrics</h3>
  <div class="grid" id="stats"></div>
  <p style="color:var(--muted);font-size:12.5px;margin:0">Traces, prompt versions and scores are in Langfuse.</p>
  <form method="dialog" style="padding:12px 0 0;border:0"><button class="ghost">Close</button></form>
</dialog>

<script>
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("input"), send = document.getElementById("send");
const SUGGESTIONS = ["What does Razorpay do?", "List fintech unicorns", "Compare Zepto and Blinkit",
                     "Which company is best to collaborate with?"];

function getSession() {
  try { return localStorage.getItem("session_id"); } catch { return null; }
}
function setSession(id) {
  try { id ? localStorage.setItem("session_id", id) : localStorage.removeItem("session_id"); } catch {}
}

// Escape first, then apply a tiny safe subset of markdown (bold, italics, bullets).
function render(md) {
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  let html = "", inList = false;
  for (const line of md.split("\n")) {
    const li = line.match(/^\s*[-*•]\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

function add(role, text, extra = {}) {
  document.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "user") el.textContent = text; else el.innerHTML = render(text);
  if (extra.companies?.length) {
    const chips = document.createElement("div"); chips.className = "chips";
    extra.companies.slice(0, 12).forEach(c => {
      const s = document.createElement("span"); s.className = "chip"; s.textContent = `${c.name} · ${c.city}`; chips.append(s);
    });
    if (extra.companies.length > 12) {
      const s = document.createElement("span"); s.className = "chip"; s.textContent = `+${extra.companies.length - 12} more`; chips.append(s);
    }
    el.append(chips);
  }
  if (extra.outcome) {
    const meta = document.createElement("div"); meta.className = "meta";
    const b = document.createElement("span"); b.className = `badge ${extra.outcome}`; b.textContent = extra.outcome;
    meta.append(b);
    if (extra.latency_ms) meta.append(`${(extra.latency_ms / 1000).toFixed(1)}s`);
    el.append(meta);
  }
  log.append(el); log.scrollTop = log.scrollHeight;
  return el;
}

function showEmpty() {
  log.innerHTML = `<div class="empty"><h2>What would you like to know?</h2>
    <div>Ask factual, filtering or "who should we partner with" questions. Follow-ups keep context.</div>
    <div class="suggestions"></div></div>`;
  const box = log.querySelector(".suggestions");
  SUGGESTIONS.forEach(q => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = q;
    b.onclick = () => ask(q); box.append(b);
  });
}

async function ask(text) {
  text = text.trim();
  if (!text || send.disabled) return;
  add("user", text);
  input.value = ""; input.style.height = "";
  send.disabled = true;
  const typing = add("bot", ""); typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, session_id: getSession()}),
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    setSession(data.session_id);
    typing.remove();
    add("bot", data.reply, data);
  } catch (e) {
    typing.remove();
    add("bot", "Couldn't reach the server. Please try again.", {outcome: "error"});
  } finally {
    send.disabled = false; input.focus();
  }
}

async function restore() {
  const id = getSession();
  if (!id) return showEmpty();
  try {
    const res = await fetch(`/api/sessions/${id}`);
    const turns = res.ok ? await res.json() : [];
    if (!turns.length) return showEmpty();
    turns.forEach(t => { add("user", t.user); add("bot", t.bot || "", {outcome: t.outcome}); });
  } catch { showEmpty(); }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
document.getElementById("newBtn").onclick = () => { setSession(null); showEmpty(); input.focus(); };
document.getElementById("metricsBtn").onclick = async () => {
  const dlg = document.getElementById("metrics"), stats = document.getElementById("stats");
  stats.textContent = "Loading…"; dlg.showModal();
  try {
    const m = await (await fetch("/api/metrics")).json();
    const items = [["Queries", m.total_queries], ["Sessions", m.sessions], ["Answered", m.answered],
      ["Clarifications", m.clarifications], ["Blocked / rejected", m.blocked_or_rejected], ["Off-topic", m.off_topic],
      ["Errors", m.errors], ["LLM fallbacks", m.llm_fallbacks], ["Avg latency", m.avg_latency_ms ? `${m.avg_latency_ms} ms` : "–"],
      ["p95 latency", m.p95_latency_ms ? `${Math.round(m.p95_latency_ms)} ms` : "–"]];
    stats.innerHTML = "";
    items.forEach(([k, v]) => {
      const d = document.createElement("div"); d.className = "stat";
      const b = document.createElement("b"); b.textContent = v ?? 0;
      const s = document.createElement("small"); s.textContent = k;
      d.append(b, s); stats.append(d);
    });
  } catch { stats.textContent = "Couldn't load metrics."; }
};
restore();
</script>
</body>
</html>
